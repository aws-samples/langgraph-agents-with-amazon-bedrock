[project]
name = "langgraph-agents-with-amazon-bedrock"
version = "0.2.0"
description = "Workshop — LangGraph agents with Amazon Bedrock (adapted from DeepLearning.AI 'AI Agents in LangGraph')."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Philipp Kaindl", email = "philikai@amazon.de" },
    { name = "Luca Perrozzi", email = "lperroz@amazon.ch" },
    { name = "Gabriel Rodriguez Garcia", email = "garoga@amazon.com" },
    { name = "Markus Rollwagen", email = "rollwag@amazon.ch" },
]

dependencies = [
    # AWS SDK
    "boto3>=1.40",

    # LangChain / LangGraph stack
    "langchain>=1.0,<2",
    "langchain-aws>=1.4,<2",
    "langchain-community>=0.4,<1",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",

    # Agentic search
    "tavily-python>=0.7",
    "langchain-tavily>=0.2",
    "ddgs>=9.14",

    # Notebook utilities + Lab 6 UI
    "python-dotenv>=1.0",
    "pygments>=2.18",
    "pygraphviz>=1.14",
    "gradio>=5.0",
    "beautifulsoup4>=4.12",
    "requests>=2.32",

    # Jupyter integration
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.uv]
# This project is not a distributable package — it's a workshop environment.
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
